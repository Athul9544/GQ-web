<!doctype html>
<meta charset="utf-8">
<title>mobile view</title>
<body style="margin:0;background:#fff">
<iframe id="f" src="/index.html" style="width:390px;height:844px;border:0;display:block"></iframe>
<script>
var q = new URLSearchParams(location.search);
document.getElementById('f').onload = function () {
  var d = this.contentDocument, w = this.contentWindow;
  d.documentElement.style.scrollBehavior = 'auto';
  var kill = d.createElement('style');
  kill.textContent = '*,*::before,*::after{transition:none !important}';
  d.head.appendChild(kill);
  var off = +(q.get('off') || 0);
  if (off) w.scrollTo(0, off);
  var click = q.get('click');
  if (click) { var c = d.querySelector(click); if (c) c.click(); }
};
</script>
</body>
