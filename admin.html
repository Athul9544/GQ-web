<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin - Golden Qube</title>
<link rel="icon" href="assets/img/favicon.png">
<link rel="stylesheet" href="assets/css/style.css?v=svcstack81">
<link rel="stylesheet" href="assets/css/admin.css?v=svcstack81">
</head>
<body class="admin-body">

<!-- ===================================================== login -->
<div class="login" id="login" hidden>
  <form class="login__card" id="login-form">
    <img class="login__logo" src="assets/img/logo.png" alt="Golden Qube">
    <h1>Admin</h1>
    <p>Sign in to manage the posts on your blog page.</p>
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Enter admin password" autocomplete="current-password" required>
    <button class="btn" type="submit">Sign In</button>
    <p class="login__error" id="login-error" hidden></p>
  </form>
</div>

<!-- ===================================================== portal -->
<div class="admin" id="admin" hidden>

  <header class="admin__bar">
    <div class="admin__brand">
      <img src="assets/img/logo.png" alt="Golden Qube">
      <span>Admin</span>
    </div>
    <div class="admin__bar-actions">
      <button class="btn btn--sm" id="new-post" type="button">New Post</button>
      <button class="admin__signout" id="signout" type="button">Sign out</button>
    </div>
  </header>

  <main class="admin__main container">

    <!-- hub --------------------------------------------------------------- -->
    <section class="hub" id="hub">
      <div class="hub__head">
        <div>
          <h1>Content Admin</h1>
          <p>Manage the entries shown on the site.</p>
        </div>
        <div class="hub__actions">
          <a class="hub__btn" href="blog.html" target="_blank" rel="noopener">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            View site
          </a>
          <button class="hub__btn" id="export" type="button">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>
            </svg>
            Export
          </button>
        </div>
      </div>

      <div class="hub__grid">
        <article class="hub__card">
          <div class="hub__card-top">
            <span class="hub__icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>
                <path d="M8 13h8"/><path d="M8 17h5"/>
              </svg>
            </span>
            <span class="hub__count" id="count-posts">00</span>
          </div>
          <h2>Blog</h2>
          <p>Articles on the Blog page. Write the text, upload a cover image, publish.</p>
          <button class="hub__manage" type="button" data-open="posts">
            Manage
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
            </svg>
          </button>
        </article>

      </div>

      <p class="hub__status" id="hub-status" hidden></p>
    </section>

    <!-- posts ------------------------------------------------------------- -->
    <div id="posts-view" hidden>
      <button class="hub__back" id="back-to-hub" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
        </svg>
        Content Admin
      </button>

    <!-- editor ------------------------------------------------------------ -->
    <section class="admin__panel" id="editor" hidden>
      <div class="admin__panel-head">
        <h2 id="editor-title">New Post</h2>
        <button class="admin__close" id="cancel-edit" type="button" aria-label="Close editor">&times;</button>
      </div>

      <form id="post-form">
        <input type="hidden" id="post-id">

        <div class="field">
          <label for="title">Title <span>required</span></label>
          <input id="title" type="text" maxlength="120" placeholder="e.g. 5 SEO changes that actually moved the needle" required>
        </div>

        <div class="field">
          <label for="category">Category</label>
          <input id="category" type="text" maxlength="40" placeholder="Digital Marketing">
        </div>

        <div class="field">
          <label for="description">Description <span>required</span></label>
          <textarea id="description" rows="6" placeholder="Write the post summary or full text here." required></textarea>
        </div>

        <div class="field">
          <label>Image</label>
          <div class="dropzone" id="dropzone">
            <input type="file" id="image" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
            <div class="dropzone__empty" id="dropzone-empty">
              <strong>Choose an image</strong>
              <span>or drag one here — PNG, JPG, WebP or GIF, up to 3 MB</span>
            </div>
            <div class="dropzone__preview" id="dropzone-preview" hidden>
              <img id="preview-img" alt="Selected image preview">
              <button class="dropzone__remove" id="remove-image" type="button">Remove image</button>
            </div>
          </div>
        </div>

        <p class="form__note" id="form-error" hidden></p>

        <div class="admin__form-actions">
          <button class="btn" type="submit" id="save-post">Publish Post</button>
          <button class="btn btn--outline" type="button" id="cancel-edit-2">Cancel</button>
        </div>
      </form>
    </section>

    <!-- list -------------------------------------------------------------- -->
    <section class="admin__panel">
      <div class="admin__panel-head">
        <h2>Posts <span class="admin__count" id="post-count">0</span></h2>
      </div>
      <div id="post-list" class="post-list"></div>
    </section>
    </div>

  </main>
</div>

<div class="toast" id="toast" hidden></div>

<script src="assets/js/admin.js?v=svcstack81"></script>
</body>
</html>
